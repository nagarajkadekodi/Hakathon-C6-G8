<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; rx: 12; ry: 12; }
    .box-primary { fill: #e0f2fe; }
    .box-secondary { fill: #eef2ff; }
    .text { font-family: Inter, Arial, sans-serif; fill: #111827; font-size: 14px; }
    .label { font-family: Inter, Arial, sans-serif; fill: #0f172a; font-size: 16px; font-weight: 700; }
    .arrow { stroke: #0f172a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .cloud { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 16; ry: 16; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0f172a" />
    </marker>
  </defs>

  <rect x="40" y="40" width="260" height="80" class="box box-primary" />
  <text x="170" y="70" class="label" text-anchor="middle">Browser / User</text>
  <text x="170" y="95" class="text" text-anchor="middle">UI / API client</text>

  <rect x="420" y="40" width="320" height="90" class="box box-primary" />
  <text x="580" y="70" class="label" text-anchor="middle">FastAPI App</text>
  <text x="580" y="95" class="text" text-anchor="middle">Handles /analyze, /download, /health</text>

  <rect x="420" y="160" width="320" height="80" class="box box-secondary" />
  <text x="580" y="190" class="label" text-anchor="middle">Incident Pipeline</text>
  <text x="580" y="210" class="text" text-anchor="middle">langgraph StateGraph</text>

  <rect x="420" y="280" width="220" height="70" class="box" />
  <text x="530" y="310" class="label" text-anchor="middle">Classifier</text>
  <text x="530" y="330" class="text" text-anchor="middle">Extract issues from logs</text>

  <rect x="670" y="280" width="220" height="70" class="box" />
  <text x="780" y="310" class="label" text-anchor="middle">Severity</text>
  <text x="780" y="330" class="text" text-anchor="middle">Triage issue impact</text>

  <rect x="420" y="380" width="220" height="70" class="box" />
  <text x="530" y="410" class="label" text-anchor="middle">Remediation</text>
  <text x="530" y="430" class="text" text-anchor="middle">Generate fix steps</text>

  <rect x="670" y="380" width="220" height="70" class="box" />
  <text x="780" y="410" class="label" text-anchor="middle">Formatter</text>
  <text x="780" y="430" class="text" text-anchor="middle">Build summary + artifacts</text>

  <rect x="540" y="480" width="220" height="70" class="box" />
  <text x="650" y="510" class="label" text-anchor="middle">Peer Review</text>
  <text x="650" y="530" class="text" text-anchor="middle">Optional review stage</text>

  <rect x="420" y="590" width="320" height="110" class="cloud" />
  <text x="580" y="620" class="label" text-anchor="middle">Outputs</text>
  <text x="580" y="645" class="text" text-anchor="middle">summary.txt, slack_card.json, jira_ticket.json</text>
  <text x="580" y="665" class="text" text-anchor="middle">checklist.md, analysis.json, review.json</text>

  <rect x="820" y="520" width="280" height="120" class="box box-primary" />
  <text x="960" y="560" class="label" text-anchor="middle">OpenRouter / LLM Provider</text>
  <text x="960" y="585" class="text" text-anchor="middle">LLM_MODEL, REVIEWER_MODEL</text>
  <text x="960" y="605" class="text" text-anchor="middle">OPENROUTER_API_KEY, OPENROUTER_BASE_URL</text>

  <line x1="300" y1="80" x2="420" y2="80" class="arrow" />
  <line x1="580" y1="130" x2="580" y2="160" class="arrow" />
  <line x1="530" y1="240" x2="530" y2="280" class="arrow" />
  <line x1="780" y1="240" x2="780" y2="280" class="arrow" />
  <line x1="530" y1="350" x2="530" y2="380" class="arrow" />
  <line x1="780" y1="350" x2="780" y2="380" class="arrow" />
  <line x1="650" y1="450" x2="650" y2="480" class="arrow" />
  <line x1="650" y1="550" x2="650" y2="590" class="arrow" />
  <line x1="760" y1="520" x2="820" y2="520" class="arrow" />
  <line x1="820" y1="620" x2="740" y2="620" class="arrow" />

  <text x="80" y="700" class="text">Note: Each pipeline node calls the LLM provider via OpenRouter.</text>
</svg>
